# Shared container image for API, worker, and MCP (different commands).
image:
  repository: ghcr.io/sthuck/sms-gateway-backend
  tag: "" # defaults to chart appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Common env (non-secret). Secrets are referenced below.
config:
  NODE_ENV: production
  HOST: "0.0.0.0"
  PORT: "8080"
  LOG_LEVEL: info
  # Built web UI bundle served by the API on the same origin (`/` -> SPA, `/v1/*` -> API).
  # Matches the bundle baked into backend/Dockerfile; set to "" to run API-only.
  WEB_DIST_DIR: /app/web-dist
  # Fastify trustProxy for request.ip (`false`, `true`, hop count `"1"`, or Ingress pod CIDR e.g. `"10.42.0.0/16"`).
  TRUST_PROXY: "false"
  # Device auth & pairing (STH-14)
  # Comma-separated Host values accepted in ES256 signed requests (e.g. `"sms.sthuck.info"`).
  # Leave empty only locally (falls back to LOCAL_DEFAULT_HOSTS + derived PUBLIC_BASE_URL host).
  DEVICE_ALLOWED_HOSTS: ""
  # Base URL embedded as `server=` in pairing QR payloads (e.g. `"https://sms.sthuck.info"`).
  DEVICE_API_PUBLIC_URL: ""
  DEVICE_ALLOW_DERIVED_HOSTS: "true"
  # Message ingestion (STH-15) — set e.g. `"IL"` for national-format senders
  INGEST_DEFAULT_PHONE_REGION: "US"
  INGEST_RATE_LIMIT_PER_DEVICE: "60"
  INGEST_RATE_LIMIT_WINDOW_SEC: "60"
  INGEST_MESSAGE_RATE_LIMIT: "10000"
  INGEST_MESSAGE_RATE_WINDOW_SEC: "3600"
  # Queue / worker (pg-boss)
  QUEUE_SCHEMA: pgboss
  QUEUE_RETRY_LIMIT: "5"
  QUEUE_RETRY_DELAY_SECONDS: "1"
  QUEUE_RETRY_BACKOFF: "true"
  QUEUE_RETRY_DELAY_MAX_SECONDS: "300"
  QUEUE_POLLING_INTERVAL_SECONDS: "1"
  QUEUE_LOCAL_CONCURRENCY: "1"
  QUEUE_SHUTDOWN_TIMEOUT_MS: "25000"
  QUEUE_METRICS_PORT: "9090" # set "0" to disable worker Prometheus endpoint
  QUEUE_METRICS_HOST: "0.0.0.0"
  # OpenAI-compatible classifier provider (non-secret pieces)
  LLM_BASE_URL: ""
  LLM_MODEL: ""
  # OIDC (Authentik or any generic provider) — see docs/deployment-auth.md
  # Homelab production examples (wire later; leave empty until deploy):
  #   OIDC_ISSUER_URL: "https://auth.sthuck.info/application/o/sms-gateway/"
  #   OIDC_CLIENT_ID: "sms-gateway"
  #   OIDC_REDIRECT_URI: "https://sms.sthuck.info/v1/auth/callback"
  #   PUBLIC_BASE_URL: "https://sms.sthuck.info"
  #   CORS_ALLOWED_ORIGINS: "https://sms.sthuck.info"
  # Authentik application slug (issuer path segment): sms-gateway
  OIDC_ISSUER_URL: ""
  OIDC_CLIENT_ID: ""
  OIDC_REDIRECT_URI: ""
  OIDC_SCOPES: "openid profile email"
  OIDC_CLAIM_EMAIL: email
  OIDC_CLAIM_NAME: name
  OIDC_AUDIENCE: ""
  OIDC_ALLOWED_ALGS: "RS256,ES256"
  REQUIRE_MFA: "true"
  MFA_CLAIMS_MISSING: deny
  AUTO_LINK_BY_EMAIL: "false"
  PUBLIC_BASE_URL: ""
  # Comma-separated browser origins for CORS + CSRF Origin checks
  CORS_ALLOWED_ORIGINS: ""
  SESSION_COOKIE_NAME: sms_session
  CSRF_COOKIE_NAME: sms_csrf
  SESSION_TTL_SECONDS: "604800"
  OIDC_APPLICATION_SLUG: sms-gateway
  # Body encryption (STH-20) — KEK file is mounted from secrets.encryptionKek*
  ENCRYPTION_ENABLED: "true"
  KEK_ID: kek-1
  KEK_FILE: /var/run/secrets/sms-gateway/kek
  # Optional: "oldId:/var/run/secrets/sms-gateway/kek-previous"
  KEK_PREVIOUS: ""
  DEK_CACHE_TTL_MS: "300000"
  DEK_CACHE_MAX_ENTRIES: "10000"

# Secret-backed references. Create these Secrets out-of-band; nothing is generated.
secrets:
  # Expected keys: DATABASE_URL
  databaseSecretName: sms-gateway-database
  databaseSecretKey: DATABASE_URL
  # All keys in encryptionKekSecretName mount under /var/run/secrets/sms-gateway/ (mode 0440)
  # so additional keys (e.g. kek-previous) work with config.KEK_PREVIOUS during rotation.
  encryptionKekSecretName: sms-gateway-encryption
  encryptionKekSecretKey: kek
  # Expected keys: LLM_API_KEY (mounted only when llmEnabled=true)
  llmSecretName: sms-gateway-llm
  llmSecretKey: LLM_API_KEY
  llmEnabled: false
  # Expected keys: OIDC_CLIENT_SECRET, SESSION_SECRET (min 32 chars)
  oidcSecretName: sms-gateway-oidc
  oidcClientSecretKey: OIDC_CLIENT_SECRET
  sessionSecretKey: SESSION_SECRET
  # When false, OIDC secret refs are omitted (API runs without login until configured).
  oidcEnabled: false
  # Optional Cloudflare Access service token headers for paired Android devices and PAT agents.
  # When cfAccessEnabled=true, all 6 keys are wired with optional: true so operators can
  # populate only shared (CF_ACCESS_CLIENT_ID/SECRET) or only separate DEVICE_*/AGENT_* keys.
  cfAccessEnabled: false
  cfAccessSecretName: sms-gateway-cf-access
  cfAccessClientIdKey: CF_ACCESS_CLIENT_ID
  cfAccessClientSecretKey: CF_ACCESS_CLIENT_SECRET
  deviceCfAccessClientIdKey: DEVICE_CF_ACCESS_CLIENT_ID
  deviceCfAccessClientSecretKey: DEVICE_CF_ACCESS_CLIENT_SECRET
  agentCfAccessClientIdKey: AGENT_CF_ACCESS_CLIENT_ID
  agentCfAccessClientSecretKey: AGENT_CF_ACCESS_CLIENT_SECRET
  # Privileged migrator credentials (used ONLY by the pre-install/pre-upgrade migrate Job when migrations.enabled=true).
  # Expected keys: MIGRATE_DATABASE_URL, SMS_APP_PASSWORD
  migrateSecretName: sms-gateway-migrate
  migrateDatabaseUrlKey: MIGRATE_DATABASE_URL
  migrateAppPasswordKey: SMS_APP_PASSWORD

api:
  enabled: true
  replicaCount: 1
  terminationGracePeriodSeconds: 30
  command: ["node", "dist/index.js"]
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      path: /healthz
      initialDelaySeconds: 5
      periodSeconds: 10
    readiness:
      path: /readyz
      initialDelaySeconds: 5
      periodSeconds: 10

worker:
  enabled: true
  replicaCount: 1
  terminationGracePeriodSeconds: 45
  command: ["node", "dist/worker.js"]
  metricsService:
    enabled: false # set true to expose ClusterIP Service for Prometheus scraping on QUEUE_METRICS_PORT
    type: ClusterIP
  probes:
    enabled: true
    liveness:
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 15
    readiness:
      path: /readyz
      initialDelaySeconds: 5
      periodSeconds: 10
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

migrations:
  # Run `node scripts/migrate.mjs up` as a Helm pre-install/pre-upgrade hook Job.
  # Requires secrets.migrateSecretName (MIGRATE_DATABASE_URL + SMS_APP_PASSWORD).
  enabled: false
  command: ["node", "scripts/migrate.mjs", "up"]
  backoffLimit: 2
  activeDeadlineSeconds: 300
  hookWeight: "-5"
  hookDeletePolicy: before-hook-creation
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

mcp:
  # MCP entrypoint (dist/mcp.js) is currently a stub with no tools/transport yet.
  enabled: false
  replicaCount: 1
  command: ["node", "dist/mcp.js"]
  service:
    type: ClusterIP
    port: 8081
  # MCP stub does not expose HTTP yet; probes disabled until transport exists.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Single `/` Ingress routes both the bundled Web UI and `/v1/*` API to `<release>-api`
# on the same origin. For nginx Ingress, consider setting
# `nginx.ingress.kubernetes.io/proxy-body-size: "2m"` for 1 MiB SMS batches, and
# preserve the external `Host` header for ES256 device signing.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    # Homelab example (deferred): sms.sthuck.info
    - host: api.sms-gateway.example
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: sms-gateway-tls
  #   hosts:
  #     - sms.sthuck.info

# Extra env vars, envFrom sources, volumes and volume mounts added to EVERY
# workload container: api, worker, mcp and the migrate Job. Rendered verbatim
# (standard Kubernetes syntax). Empty by default.
#
# Example -- trust a private CA (the API fetches OIDC discovery/JWKS server-side
# from Node.js, which ignores the OS trust store additions of the cluster):
#   extraVolumes:
#     - name: private-ca
#       configMap:
#         name: private-ca        # key ca.crt
#   extraVolumeMounts:
#     - name: private-ca
#       mountPath: /etc/ssl/private-ca
#       readOnly: true
#   extraEnv:
#     - name: NODE_EXTRA_CA_CERTS
#       value: /etc/ssl/private-ca/ca.crt
extraEnv: []
extraEnvFrom: []
extraVolumes: []
extraVolumeMounts: []
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}

# Postgres is NOT bundled. See README.md for StatefulSet / CloudNativePG options.
postgres:
  # Informational only — used in docs / comments rendered into NOTES.txt
  managedExternally: true
