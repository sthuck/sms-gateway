{{- if .Values.api.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sms-gateway.fullname" . }}-api
  labels:
    {{- include "sms-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  NODE_ENV: {{ .Values.config.NODE_ENV | quote }}
  HOST: {{ .Values.config.HOST | quote }}
  PORT: {{ .Values.config.PORT | quote }}
  LOG_LEVEL: {{ .Values.config.LOG_LEVEL | quote }}
  WEB_DIST_DIR: {{ .Values.config.WEB_DIST_DIR | quote }}
  TRUST_PROXY: {{ .Values.config.TRUST_PROXY | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.CORS_ALLOWED_ORIGINS | quote }}
  DEVICE_ALLOWED_HOSTS: {{ .Values.config.DEVICE_ALLOWED_HOSTS | quote }}
  DEVICE_API_PUBLIC_URL: {{ .Values.config.DEVICE_API_PUBLIC_URL | quote }}
  DEVICE_ALLOW_DERIVED_HOSTS: {{ .Values.config.DEVICE_ALLOW_DERIVED_HOSTS | quote }}
  INGEST_DEFAULT_PHONE_REGION: {{ .Values.config.INGEST_DEFAULT_PHONE_REGION | quote }}
  INGEST_RATE_LIMIT_PER_DEVICE: {{ .Values.config.INGEST_RATE_LIMIT_PER_DEVICE | quote }}
  INGEST_RATE_LIMIT_WINDOW_SEC: {{ .Values.config.INGEST_RATE_LIMIT_WINDOW_SEC | quote }}
  INGEST_MESSAGE_RATE_LIMIT: {{ .Values.config.INGEST_MESSAGE_RATE_LIMIT | quote }}
  INGEST_MESSAGE_RATE_WINDOW_SEC: {{ .Values.config.INGEST_MESSAGE_RATE_WINDOW_SEC | quote }}
  ENCRYPTION_ENABLED: {{ .Values.config.ENCRYPTION_ENABLED | quote }}
  KEK_ID: {{ .Values.config.KEK_ID | quote }}
  KEK_FILE: {{ .Values.config.KEK_FILE | quote }}
  KEK_PREVIOUS: {{ .Values.config.KEK_PREVIOUS | quote }}
  DEK_CACHE_TTL_MS: {{ .Values.config.DEK_CACHE_TTL_MS | quote }}
  DEK_CACHE_MAX_ENTRIES: {{ .Values.config.DEK_CACHE_MAX_ENTRIES | quote }}
  QUEUE_SCHEMA: {{ .Values.config.QUEUE_SCHEMA | quote }}
  QUEUE_RETRY_LIMIT: {{ .Values.config.QUEUE_RETRY_LIMIT | quote }}
  QUEUE_RETRY_DELAY_SECONDS: {{ .Values.config.QUEUE_RETRY_DELAY_SECONDS | quote }}
  QUEUE_RETRY_BACKOFF: {{ .Values.config.QUEUE_RETRY_BACKOFF | quote }}
  QUEUE_RETRY_DELAY_MAX_SECONDS: {{ .Values.config.QUEUE_RETRY_DELAY_MAX_SECONDS | quote }}
  LLM_BASE_URL: {{ .Values.config.LLM_BASE_URL | quote }}
  LLM_MODEL: {{ .Values.config.LLM_MODEL | quote }}
  {{- if .Values.secrets.oidcEnabled }}
  OIDC_ISSUER_URL: {{ .Values.config.OIDC_ISSUER_URL | quote }}
  OIDC_CLIENT_ID: {{ .Values.config.OIDC_CLIENT_ID | quote }}
  OIDC_REDIRECT_URI: {{ .Values.config.OIDC_REDIRECT_URI | quote }}
  OIDC_SCOPES: {{ .Values.config.OIDC_SCOPES | quote }}
  OIDC_CLAIM_EMAIL: {{ .Values.config.OIDC_CLAIM_EMAIL | quote }}
  OIDC_CLAIM_NAME: {{ .Values.config.OIDC_CLAIM_NAME | quote }}
  OIDC_ALLOWED_ALGS: {{ .Values.config.OIDC_ALLOWED_ALGS | quote }}
  REQUIRE_MFA: {{ .Values.config.REQUIRE_MFA | quote }}
  MFA_CLAIMS_MISSING: {{ .Values.config.MFA_CLAIMS_MISSING | quote }}
  AUTO_LINK_BY_EMAIL: {{ .Values.config.AUTO_LINK_BY_EMAIL | quote }}
  SESSION_COOKIE_NAME: {{ .Values.config.SESSION_COOKIE_NAME | quote }}
  CSRF_COOKIE_NAME: {{ .Values.config.CSRF_COOKIE_NAME | quote }}
  SESSION_TTL_SECONDS: {{ .Values.config.SESSION_TTL_SECONDS | quote }}
  OIDC_APPLICATION_SLUG: {{ .Values.config.OIDC_APPLICATION_SLUG | quote }}
  {{- if .Values.config.OIDC_AUDIENCE }}
  OIDC_AUDIENCE: {{ .Values.config.OIDC_AUDIENCE | quote }}
  {{- end }}
  {{- if .Values.config.PUBLIC_BASE_URL }}
  PUBLIC_BASE_URL: {{ .Values.config.PUBLIC_BASE_URL | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- if .Values.worker.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sms-gateway.fullname" . }}-worker
  labels:
    {{- include "sms-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
data:
  NODE_ENV: {{ .Values.config.NODE_ENV | quote }}
  LOG_LEVEL: {{ .Values.config.LOG_LEVEL | quote }}
  ENCRYPTION_ENABLED: {{ .Values.config.ENCRYPTION_ENABLED | quote }}
  KEK_ID: {{ .Values.config.KEK_ID | quote }}
  KEK_FILE: {{ .Values.config.KEK_FILE | quote }}
  KEK_PREVIOUS: {{ .Values.config.KEK_PREVIOUS | quote }}
  DEK_CACHE_TTL_MS: {{ .Values.config.DEK_CACHE_TTL_MS | quote }}
  DEK_CACHE_MAX_ENTRIES: {{ .Values.config.DEK_CACHE_MAX_ENTRIES | quote }}
  QUEUE_SCHEMA: {{ .Values.config.QUEUE_SCHEMA | quote }}
  QUEUE_RETRY_LIMIT: {{ .Values.config.QUEUE_RETRY_LIMIT | quote }}
  QUEUE_RETRY_DELAY_SECONDS: {{ .Values.config.QUEUE_RETRY_DELAY_SECONDS | quote }}
  QUEUE_RETRY_BACKOFF: {{ .Values.config.QUEUE_RETRY_BACKOFF | quote }}
  QUEUE_RETRY_DELAY_MAX_SECONDS: {{ .Values.config.QUEUE_RETRY_DELAY_MAX_SECONDS | quote }}
  QUEUE_POLLING_INTERVAL_SECONDS: {{ .Values.config.QUEUE_POLLING_INTERVAL_SECONDS | quote }}
  QUEUE_LOCAL_CONCURRENCY: {{ .Values.config.QUEUE_LOCAL_CONCURRENCY | quote }}
  QUEUE_SHUTDOWN_TIMEOUT_MS: {{ .Values.config.QUEUE_SHUTDOWN_TIMEOUT_MS | quote }}
  QUEUE_METRICS_PORT: {{ .Values.config.QUEUE_METRICS_PORT | quote }}
  QUEUE_METRICS_HOST: {{ .Values.config.QUEUE_METRICS_HOST | quote }}
  LLM_BASE_URL: {{ .Values.config.LLM_BASE_URL | quote }}
  LLM_MODEL: {{ .Values.config.LLM_MODEL | quote }}
{{- end }}
{{- if .Values.mcp.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sms-gateway.fullname" . }}-mcp
  labels:
    {{- include "sms-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
data:
  NODE_ENV: {{ .Values.config.NODE_ENV | quote }}
  HOST: {{ .Values.config.HOST | quote }}
  PORT: {{ .Values.mcp.service.port | quote }}
  LOG_LEVEL: {{ .Values.config.LOG_LEVEL | quote }}
  ENCRYPTION_ENABLED: "false"
{{- end }}
