# Authentik blueprint — OAuth2/OIDC provider + application for SMS Gateway.
# Application slug: sms-gateway
#   Homelab issuer: https://auth.sthuck.info/application/o/sms-gateway/
#   Local Compose issuer: http://127.0.0.1:9000/application/o/sms-gateway/
#
# Apply via Authentik UI (System → Blueprints) or follow manual steps in
# docs/local-dev.md / docs/deployment-auth.md if import is unavailable.
#
# Client secret below is DEV-ONLY (local Compose). Homelab/production must
# set a real secret in Authentik and store it in the sms-gateway-oidc k8s Secret.

version: 1
metadata:
  name: sms-gateway-oidc
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    state: present
    identifiers:
      name: SMS Gateway
    attrs:
      name: SMS Gateway
      client_type: confidential
      client_id: sms-gateway
      # DEV-ONLY client secret — replace in Authentik for homelab/production
      client_secret: "dev-only-oidc-client-secret"
      redirect_uris: |
        https://sms.sthuck.info/v1/auth/callback
        http://127.0.0.1:8080/v1/auth/callback
        http://localhost:8080/v1/auth/callback
        http://localhost:5173/v1/auth/callback
      sub_mode: user_id
      include_claims_in_id_token: true
      issuer_mode: per_provider

  - model: authentik_core.application
    state: present
    identifiers:
      slug: sms-gateway
    attrs:
      name: SMS Gateway
      slug: sms-gateway
      provider: !KeyOf provider
      meta_launch_url: https://sms.sthuck.info/v1/auth/login

  - model: authentik_core.user
    state: present
    identifiers:
      username: sms-dev
    attrs:
      username: sms-dev
      name: SMS Dev User
      email: sms-dev@example.com
      # DEV-ONLY password for the seeded local test user
      password: "dev-only-sms-user-password"
      is_active: true
