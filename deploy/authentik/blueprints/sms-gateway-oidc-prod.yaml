# Production / homelab Authentik blueprint. Tested against authentik 2026.8.
# Prod redirect URI only. No client secret in the file, no seeded users.
#
# Application slug: sms-gateway
# Issuer: https://sso.sthuck.info/application/o/sms-gateway/
#   (per_provider issuer mode; the path matters -- see docs/deployment-auth.md)
#
# Set in the authentik WORKER environment before applying (blueprints run there):
#   SMS_GATEWAY_OIDC_CLIENT_SECRET  -- generate out-of-band; the same value goes
#     into the sms-gateway k8s Secret `sms-gateway-oidc` as OIDC_CLIENT_SECRET.
#     Never commit it in plaintext.
#
# Requires authentik >= 2024.10 (list-form redirect_uris, invalidation_flow).
# The flows, signing key and scope mappings referenced below are authentik's
# built-in defaults.
#
# MFA: the backend defaults to REQUIRE_MFA=true / MFA_CLAIMS_MISSING=deny and
# checks the ID token's `amr` claim. This blueprint does not change flows; the
# authentication flow must enforce MFA and must not let it be skipped -- see
# "MFA requirements" in docs/deployment-auth.md.
#
# See docs/deployment-auth.md. Do NOT import the *-dev.yaml blueprint in prod.

version: 1
metadata:
  name: sms-gateway-oidc-prod
  # Never auto-apply if this file is present under Authentik's blueprints mount.
  # Apply only via a controlled import, or remove this label deliberately when
  # mounting it (as the homelab deployment does) once the env var is set.
  labels:
    blueprints.goauthentik.io/instantiate: "false"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    state: present
    identifiers:
      name: SMS Gateway
    attrs:
      name: SMS Gateway
      # Both required. Implicit consent: owners are the only users.
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: sms-gateway
      client_secret: !Env SMS_GATEWAY_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://sms.sthuck.info/v1/auth/callback
      # REQUIRED: without a key pair authentik signs ID tokens with HS256 using
      # the client secret, which the backend rejects (OIDC_ALLOWED_ALGS=RS256,ES256).
      # The built-in self-signed certificate is RSA => RS256.
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      issuer_mode: per_provider
      sub_mode: user_id
      include_claims_in_id_token: true
      # Without scope mappings only `openid` is honoured, and the email/name
      # claims (OIDC_CLAIM_EMAIL / OIDC_CLAIM_NAME) are missing.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]

  - model: authentik_core.application
    state: present
    identifiers:
      slug: sms-gateway
    attrs:
      name: SMS Gateway
      slug: sms-gateway
      provider: !KeyOf provider
      meta_launch_url: https://sms.sthuck.info/v1/auth/login
