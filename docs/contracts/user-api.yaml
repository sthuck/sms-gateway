openapi: 3.1.0
info:
  title: SMS Gateway User / Web API
  summary: Browser session auth and owner-facing endpoints (STH-9 / STH-14)
  description: |
    User authentication for the web UI and bearer-JWT API access, plus
    owner-facing device management (pairing code issue, list, rename,
    revoke), owner inbox messages (STH-21), and stream CRUD (STH-23).

    Login uses a generic OIDC provider (Authentik in production/homelab)
    via authorization code + PKCE. The browser holds an httpOnly session
    cookie; API clients may send `Authorization: Bearer` JWTs from the
    same issuer.

    Device-signed requests are **not** accepted on these endpoints.
    Pairing completion and device status live in `device-api.yaml`.

    Errors use RFC 9457 `application/problem+json` with `code` and
    `retryable`, consistent with `docs/contracts/semantics.md`.
  version: 0.4.1
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: https://sms.sthuck.info
    description: Homelab production origin (HTTPS)
  - url: http://127.0.0.1:8080
    description: Local API
  - url: http://10.0.2.2:8080
    description: Android emulator → host backend

tags:
  - name: Auth
    description: OIDC login, callback, logout, and session introspection
  - name: Devices
    description: Owner-facing device pairing, list, rename, and revocation
  - name: Messages
    description: Owner inbox — list, get, delete (STH-21)
  - name: Streams
    description: Owner-facing stream definitions (rules / AI / hybrid)

paths:
  /v1/auth/login:
    get:
      operationId: startLogin
      tags: [Auth]
      summary: Start OIDC authorization-code + PKCE login
      description: |
        Redirects the browser to the configured OIDC authorization endpoint.
        Sets a short-lived httpOnly OAuth state cookie sealing PKCE verifier,
        state, and nonce.
      security: []
      responses:
        "302":
          description: Redirect to the IdP authorization endpoint
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/AuthMisconfigured"

  /v1/auth/callback:
    get:
      operationId: authCallback
      tags: [Auth]
      summary: OIDC redirect callback
      description: |
        Validates state/nonce/PKCE, exchanges the code, checks MFA claims,
        provisions or reuses `(issuer, sub)` → `users.id`, and sets the
        session + CSRF cookies.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Login succeeded; redirect to PUBLIC_BASE_URL
          headers:
            Set-Cookie:
              description: Session and CSRF cookies
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/MfaRequired"
        "503":
          $ref: "#/components/responses/AuthMisconfigured"

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Revoke the server-side session and clear cookies
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Logged out
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthMisconfigured"

  /v1/auth/me:
    get:
      operationId: getMe
      tags: [Auth]
      summary: Current authenticated user
      security:
        - sessionCookie: []
        - bearerJwt: []
      responses:
        "200":
          description: Authenticated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/pairing-codes:
    post:
      operationId: createPairingCode
      tags: [Devices]
      summary: Issue a single-use device pairing code
      description: |
        Authenticated owners receive a short Crockford Base32 code (8
        characters, optionally displayed as `XXXX-XXXX`) and a QR payload
        `smsgw://pair?code=<code>` with optional `server=<url-encoded base URL>`.

        The plaintext code is returned once; the server stores only a
        SHA-256 hash. Codes expire after 5 minutes and are burned on the
        first successful `POST /v1/devices/pair` (see device-api.yaml).
      security:
        - sessionCookie: []
        - bearerJwt: []
      responses:
        "201":
          description: Pairing code issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingCodeResponse"
              examples:
                issued:
                  value:
                    code: 7K3M-9Q2P
                    qr_payload: smsgw://pair?code=7K3M-9Q2P&server=http%3A%2F%2F10.0.2.2%3A8080
                    expires_at: "2026-11-18T10:00:00.000Z"
                    ttl_seconds: 300
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthMisconfigured"

  /v1/devices:
    get:
      operationId: listDevices
      tags: [Devices]
      summary: List devices for the authenticated owner
      security:
        - sessionCookie: []
        - bearerJwt: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
          description: Single-valued; repeating the param yields 400
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthMisconfigured"

  /v1/devices/{id}:
    patch:
      operationId: renameDevice
      tags: [Devices]
      summary: Rename a device owned by the current user
      description: |
        Updates `devices.name`. Other owners' devices return `404 not_found` (RLS).
      security:
        - sessionCookie: []
        - bearerJwt: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchDeviceRequest"
      responses:
        "200":
          description: Renamed device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerDevice"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/devices/{id}/revoke:
    post:
      operationId: revokeDevice
      tags: [Devices]
      summary: Revoke a device owned by the current user
      description: |
        Marks the device `status=revoked` and sets `device_credentials.revoked_at`.
        Takes effect on the next device-authenticated request (status is
        read from Postgres on every request; not cached). Other owners'
        devices return `404 not_found` (RLS).
      security:
        - sessionCookie: []
        - bearerJwt: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Device revoked (idempotent if already revoked)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"


  /v1/messages:
    get:
      operationId: listMessages
      tags: [Messages]
      summary: List inbox messages for the authenticated owner
      description: |
        Cursor pagination on `(received_at, id)` descending (opaque `cursor`).
        Plaintext metadata filters (`device_id`, `sender`, date range) are
        applied in SQL. Optional `q` is a case-insensitive substring match on
        the **decrypted** body (server-side decrypt-then-filter per ADR 0002).

        Search cost is bounded per request: SQL fetches at most a fixed scan
        window of candidates, and decrypt-then-filter also stops on a wall-clock
        budget. Hitting either cap with fewer than `limit` matches still returns
        HTTP 200 with a `next_cursor` past the scanned window so clients can
        continue; the cost cap never produces a 5xx. Repeated/array query params
        (e.g. `?q=a&q=b`) are rejected with `400 invalid_request`.

        Other owners' rows are invisible under RLS.
      security:
        - sessionCookie: []
        - bearerJwt: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Single-valued; repeating the param yields 400
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: |
            Opaque cursor from a previous `next_cursor`. After a search cost
            cap, this advances past the scanned candidates (not only matches).
            Single-valued; repeating the param yields 400.
        - name: device_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Single-valued; repeating the param yields 400
        - name: sender
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
          description: Single-valued; repeating the param yields 400
        - name: received_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Single-valued; repeating the param yields 400
        - name: received_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Single-valued; repeating the param yields 400
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: |
            Substring search over decrypted body text. Single-valued;
            repeating the param yields 400.
      responses:
        "200":
          description: |
            Message page. When `q` is set, `next_cursor` may be present even if
            fewer than `limit` messages matched, indicating the scan/time budget
            was exhausted and more candidates may remain.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerMessageList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuthMisconfigured"

  /v1/messages/{id}:
    get:
      operationId: getMessage
      tags: [Messages]
      summary: Get one inbox message
      security:
        - sessionCookie: []
        - bearerJwt: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuthMisconfigured"
    delete:
      operationId: deleteMessage
      tags: [Messages]
      summary: Delete one inbox message
      description: |
        Deletes under RLS. Missing or other-owner ids return `404 not_found`.
      security:
        - sessionCookie: []
        - bearerJwt: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/streams:
    get:
      operationId: listStreams
      tags: [Streams]
      summary: List streams for the authenticated owner
      security:
        - sessionCookie: []
        - bearerJwt: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Stream list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createStream
      tags: [Streams]
      summary: Create a stream definition
      description: |
        Creates a stream with `mode` `rules` | `ai` | `hybrid`. `rules_json`
        is validated server-side (field-pathed errors). AI fields are accepted
        but inactive until Phase 5. Initial `version` is 1.
      security:
        - sessionCookie: []
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStreamRequest"
      responses:
        "201":
          description: Stream created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/streams/{id}:
    get:
      operationId: getStream
      tags: [Streams]
      summary: Get one stream by id
      security:
        - sessionCookie: []
        - bearerJwt: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateStream
      tags: [Streams]
      summary: Update a stream
      description: |
        Name-only updates do not bump `version`. Changes to `mode`,
        `rules_json`, or `ai_prompt` increment `version` and enqueue
        `stream.reclassify` in the same transaction. Other owners' streams
        return `404 not_found` (RLS).
      security:
        - sessionCookie: []
        - bearerJwt: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchStreamRequest"
      responses:
        "200":
          description: Updated stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stream"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteStream
      tags: [Streams]
      summary: Hard-delete a stream
      security:
        - sessionCookie: []
        - bearerJwt: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/streams:preview:
    post:
      operationId: previewStream
      tags: [Streams]
      summary: Preview an unsaved stream definition against recent messages
      description: |
        Evaluates `rules_json` against the owner's last N messages (default 500,
        max 500). Only the rules portion is evaluated; when `mode` is `ai` or
        `hybrid`, the response sets `ai_evaluated: false` and a `note` that the
        AI part was not evaluated. Invalid definitions return the same
        field-pathed errors as create/update.
      security:
        - sessionCookie: []
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewStreamRequest"
      responses:
        "200":
          description: Preview matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewStreamResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/streams/{id}/messages:
    get:
      operationId: listStreamMessages
      tags: [Streams]
      summary: List messages belonging to a stream
      description: |
        Owner view of messages linked via `stream_membership`. Cursor pagination
        is opaque and ordered by `received_at` descending then `id`. Other
        owners' streams return `404 not_found` (RLS).
      security:
        - sessionCookie: []
        - bearerJwt: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            description: Opaque cursor from a previous `next_cursor`
      responses:
        "200":
          description: Stream message page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamMessageList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sms_session
      description: Opaque session id (stored hashed server-side)
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from the OIDC provider (JWKS-verified)

  schemas:
    Me:
      type: object
      additionalProperties: false
      required: [id, email, mfa_enrolled]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        mfa_enrolled:
          type: boolean
        display_name:
          type: [string, "null"]
        last_auth_method:
          type: [string, "null"]
        auth_method:
          type: [string, "null"]
          enum: [session, bearer, null]

    PairingCodeResponse:
      type: object
      additionalProperties: false
      required: [code, qr_payload, expires_at, ttl_seconds]
      properties:
        code:
          type: string
          description: |
            8 Crockford Base32 characters, hyphenated as `XXXX-XXXX`.
            Case-insensitive when redeemed. Returned only once.
          pattern: "^[A-HJ-NP-TV-Z0-9]{4}-[A-HJ-NP-TV-Z0-9]{4}$"
          examples: ["7K3M-9Q2P"]
        qr_payload:
          type: string
          description: |
            `smsgw://pair?code=<code>` plus optional `server` query
            parameter (URL-encoded API base URL for the Android app).
          examples:
            - "smsgw://pair?code=7K3M-9Q2P&server=http%3A%2F%2F10.0.2.2%3A8080"
        expires_at:
          type: string
          format: date-time
        ttl_seconds:
          type: integer
          minimum: 1
          examples: [300]

    StreamMode:
      type: string
      enum: [rules, ai, hybrid]

    StreamBackfillStatus:
      type: string
      enum: [pending, running, completed, failed]

    StreamRule:
      type: object
      description: |
        Discriminated by `type`. Leaf rules: sender_equals, sender_prefix,
        sender_regex, body_keyword, body_regex, device, sim_slot. Groups:
        and, or (nested). Regex patterns are ReDoS-checked server-side.
      additionalProperties: true
      required: [type]
      properties:
        type:
          type: string
          enum:
            - sender_equals
            - sender_prefix
            - sender_regex
            - body_keyword
            - body_regex
            - device
            - sim_slot
            - and
            - or


    OwnerDevice:
      type: object
      additionalProperties: false
      required: [id, name, status, created_at, last_seen_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [active, revoked]
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time

    DeviceList:
      type: object
      additionalProperties: false
      required: [devices, limit]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/OwnerDevice"
        limit:
          type: integer
          minimum: 1
          maximum: 100

    PatchDeviceRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    OwnerMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - sender
        - body
        - received_at
        - device_id
        - sim_slot
        - direction
      properties:
        id:
          type: string
          format: uuid
        sender:
          type: string
        body:
          type: string
          description: Decrypted plaintext (empty string round-trips)
        received_at:
          type: string
          format: date-time
        device_id:
          type: string
          format: uuid
        sim_slot:
          type: [integer, "null"]
        direction:
          type: string
          enum: [inbound, outbound]

    OwnerMessageList:
      type: object
      additionalProperties: false
      required: [messages, next_cursor, limit]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OwnerMessage"
        next_cursor:
          type: [string, "null"]
          description: |
            Opaque keyset cursor. Present when more rows remain, including when
            a `q` search hit the per-request decrypt scan or wall-clock budget
            before filling `limit` matches.
        limit:
          type: integer
          minimum: 1
          maximum: 200

    Stream:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - mode
        - rules_json
        - ai_prompt
        - version
        - backfill_status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        mode:
          $ref: "#/components/schemas/StreamMode"
        rules_json:
          type: array
          items:
            $ref: "#/components/schemas/StreamRule"
        ai_prompt:
          type: [string, "null"]
        version:
          type: integer
          minimum: 1
        backfill_status:
          $ref: "#/components/schemas/StreamBackfillStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StreamList:
      type: object
      additionalProperties: false
      required: [streams, limit]
      properties:
        streams:
          type: array
          items:
            $ref: "#/components/schemas/Stream"
        limit:
          type: integer
          minimum: 1
          maximum: 100

    CreateStreamRequest:
      type: object
      additionalProperties: false
      required: [name, mode]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        mode:
          $ref: "#/components/schemas/StreamMode"
        rules_json:
          type: array
          items:
            $ref: "#/components/schemas/StreamRule"
        ai_prompt:
          type: [string, "null"]

    PatchStreamRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        mode:
          $ref: "#/components/schemas/StreamMode"
        rules_json:
          type: array
          items:
            $ref: "#/components/schemas/StreamRule"
        ai_prompt:
          type: [string, "null"]

    PreviewStreamRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/StreamMode"
        rules_json:
          type: array
          items:
            $ref: "#/components/schemas/StreamRule"
        ai_prompt:
          type: [string, "null"]
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 500

    MatchedRuleRef:
      type: object
      additionalProperties: false
      required: [path, type]
      properties:
        path:
          type: string
          description: Field path of the matching rule node
        type:
          type: string

    PreviewMatch:
      type: object
      additionalProperties: false
      required: [message_id, sender, received_at, body_snippet, matched_rule]
      properties:
        message_id:
          type: string
          format: uuid
        sender:
          type: string
        received_at:
          type: string
          format: date-time
        body_snippet:
          type: string
        matched_rule:
          oneOf:
            - $ref: "#/components/schemas/MatchedRuleRef"
            - type: "null"

    PreviewStreamResponse:
      type: object
      additionalProperties: false
      required: [matches, evaluated, matched, ai_evaluated, note, limit]
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/PreviewMatch"
        evaluated:
          type: integer
          minimum: 0
        matched:
          type: integer
          minimum: 0
        ai_evaluated:
          type: boolean
          description: Always false in preview; AI classification is not run
        note:
          type: [string, "null"]
        limit:
          type: integer
          minimum: 1
          maximum: 500

    StreamMessage:
      type: object
      additionalProperties: false
      required:
        - id
        - sender
        - body
        - received_at
        - device_id
        - sim_slot
        - direction
        - matched_by
        - confidence
        - stream_version
      properties:
        id:
          type: string
          format: uuid
        sender:
          type: string
        body:
          type: string
        received_at:
          type: string
          format: date-time
        device_id:
          type: string
          format: uuid
        sim_slot:
          type: [integer, "null"]
        direction:
          type: string
          enum: [inbound, outbound]
        matched_by:
          type: string
          enum: [rule, ai]
        confidence:
          type: [number, "null"]
        stream_version:
          type: integer
          minimum: 1

    StreamMessageList:
      type: object
      additionalProperties: false
      required: [messages, next_cursor, limit]
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/StreamMessage"
        next_cursor:
          type: [string, "null"]
        limit:
          type: integer
          minimum: 1
          maximum: 200

    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, retryable]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - mfa_required
            - csrf_rejected
            - auth_misconfigured
            - not_found
            - internal_error
            - service_unavailable
        retryable:
          type: boolean

  responses:
    Unauthorized:
      description: Missing, expired, or invalid session/token
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            missing:
              value:
                type: https://sms-gateway.example/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: Missing or invalid access token
                code: unauthorized
                retryable: false
    MfaRequired:
      description: MFA required but not evidenced in amr/acr
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            mfa:
              value:
                type: https://sms-gateway.example/problems/mfa_required
                title: Multi-factor authentication required
                status: 401
                detail: MFA required but amr/acr claims are missing
                code: mfa_required
                retryable: false
    InvalidRequest:
      description: Bad OAuth callback (state/nonce/code)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found for this owner
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            missing:
              value:
                type: https://sms-gateway.example/problems/not_found
                title: Not found
                status: 404
                detail: Device not found
                code: not_found
                retryable: false
    AuthMisconfigured:
      description: OIDC env not configured
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
