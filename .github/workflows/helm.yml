name: Helm

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm.yml"
  pull_request:
    paths:
      - "deploy/helm/**"
      - ".github/workflows/helm.yml"

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    name: Lint and template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - run: helm lint deploy/helm/sms-gateway
      - run: helm template sms-gateway deploy/helm/sms-gateway >/dev/null
      - name: helm template (homelab values)
        run: helm template sms-gateway deploy/helm/sms-gateway -f deploy/helm/sms-gateway/values-homelab.yaml >/dev/null
      - name: helm lint (homelab values)
        run: helm lint deploy/helm/sms-gateway -f deploy/helm/sms-gateway/values-homelab.yaml
