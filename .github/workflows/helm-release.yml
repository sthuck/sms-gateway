name: Helm Release

# Packages deploy/helm/sms-gateway and pushes it as an OCI chart artifact to
# GHCR (oci://ghcr.io/<owner>/charts/sms-gateway) when a GitHub Release is
# published or triggered manually via workflow_dispatch.
#
# Note: Releases auto-created by android-release.yml using GITHUB_TOKEN do not
# trigger `release` events in GitHub Actions — publish the Release from the
# GitHub UI / local `gh release create`, or run this workflow via
# workflow_dispatch.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer chart version override (defaults to <Chart.yaml version>-sha.<short>)"
        required: false
        type: string
        default: ""
      app_version:
        description: "appVersion / default image.tag override (defaults to sha-<short>)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: helm-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Lint, package, and push Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.ref }}

      - name: Resolve and validate chart version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_APP_VERSION: ${{ inputs.app_version }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OWNER_LOWER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          OCI_REPO="oci://ghcr.io/${OWNER_LOWER}/charts"
          SHORT_SHA="${SHA:0:7}"

          if [ "$EVENT_NAME" = "release" ]; then
            TAG="$RELEASE_TAG"
            CHART_VERSION="${TAG#v}"
            APP_VERSION="$TAG"
          else
            if [ -n "$INPUT_VERSION" ]; then
              CHART_VERSION="$INPUT_VERSION"
            else
              BASE_VERSION="$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*/\1/p' deploy/helm/sms-gateway/Chart.yaml | head -n 1)"
              if [ -z "$BASE_VERSION" ]; then
                echo "Could not parse version from deploy/helm/sms-gateway/Chart.yaml" >&2
                exit 1
              fi
              BASE_CORE="${BASE_VERSION%%[-+]*}"
              CHART_VERSION="${BASE_CORE}-sha.${SHORT_SHA}"
            fi

            if [ -n "$INPUT_APP_VERSION" ]; then
              APP_VERSION="$INPUT_APP_VERSION"
            else
              APP_VERSION="sha-${SHORT_SHA}"
            fi
          fi

          if ! [[ "$CHART_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid SemVer 2.0 chart version: '$CHART_VERSION'" >&2
            exit 1
          fi

          if ! [[ "$APP_VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid Docker appVersion tag: '$APP_VERSION'" >&2
            exit 1
          fi

          echo "chart_version=$CHART_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "oci_repo=$OCI_REPO" >> "$GITHUB_OUTPUT"
          echo "chart_ref=${OCI_REPO}/sms-gateway" >> "$GITHUB_OUTPUT"
          echo "Resolved chart_version=$CHART_VERSION app_version=$APP_VERSION oci_repo=$OCI_REPO"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Lint and template chart
        run: |
          set -euo pipefail
          helm lint deploy/helm/sms-gateway
          helm template sms-gateway deploy/helm/sms-gateway >/dev/null

      - name: Package chart
        id: package
        env:
          CHART_VERSION: ${{ steps.meta.outputs.chart_version }}
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/charts"
          helm package deploy/helm/sms-gateway \
            --version "$CHART_VERSION" \
            --app-version "$APP_VERSION" \
            --destination "$RUNNER_TEMP/charts"
          PKG_PATH="$RUNNER_TEMP/charts/sms-gateway-${CHART_VERSION}.tgz"
          if [ ! -f "$PKG_PATH" ]; then
            echo "Expected packaged chart missing: $PKG_PATH" >&2
            exit 1
          fi
          echo "package_path=$PKG_PATH" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push chart to GHCR
        env:
          PKG_PATH: ${{ steps.package.outputs.package_path }}
          OCI_REPO: ${{ steps.meta.outputs.oci_repo }}
        run: |
          set -euo pipefail
          helm push "$PKG_PATH" "$OCI_REPO"

      - name: Write release summary
        env:
          CHART_REF: ${{ steps.meta.outputs.chart_ref }}
          CHART_VERSION: ${{ steps.meta.outputs.chart_version }}
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
        run: |
          {
            echo '### Published GHCR Helm chart'
            echo
            echo "- **Chart:** \`${CHART_REF}\`"
            echo "- **Version:** \`${CHART_VERSION}\`"
            echo "- **appVersion (default \`image.tag\`):** \`${APP_VERSION}\`"
            echo
            echo '```bash'
            echo "helm upgrade --install sms-gateway ${CHART_REF} --version ${CHART_VERSION} -f my-values.yaml -n <ns>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
