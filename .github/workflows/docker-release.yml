name: Docker Release

# Builds backend/Dockerfile (API + worker + MCP + bundled web/dist) for
# linux/amd64 and publishes to GitHub Container Registry (GHCR) when a GitHub
# Release is published or triggered manually via workflow_dispatch.
#
# Note: Releases auto-created by android-release.yml using GITHUB_TOKEN do not
# trigger `release` events in GitHub Actions — publish the Release from the
# GitHub UI / local `gh release create`, or run this workflow via
# workflow_dispatch. See docs/deploy.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional extra image tag (defaults to sha-<short> on manual runs)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sms-gateway-backend

jobs:
  publish:
    name: Build and push GHCR image
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual tag input
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if ! [[ "$INPUT_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: '$INPUT_TAG'" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
            type=sha,prefix=sha-

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_APK_DOWNLOAD_URL=${{ vars.VITE_APK_DOWNLOAD_URL }}
            VITE_CSRF_COOKIE_NAME=${{ vars.VITE_CSRF_COOKIE_NAME }}

      - name: Write release summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '### Published GHCR image (`linux/amd64`)'
            echo
            echo "**Digest:** \`${DIGEST}\`"
            echo
            echo "**Tags:**"
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "- \`${tag}\`"
            done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
