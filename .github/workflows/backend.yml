# Path-filtered backend workflow (also covered by ci.yml).
# Kept so folder-level status names remain discoverable; primary gate is "CI success".
name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "docker-compose.yml"
      - "docker-compose.authentik.yml"
      - "deploy/authentik/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "docker-compose.yml"
      - "docker-compose.authentik.yml"
      - "deploy/authentik/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint, typecheck, test, docker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sms
          POSTGRES_PASSWORD: sms
          POSTGRES_DB: sms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sms -d sms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgres://sms:sms@localhost:5432/sms
      MIGRATE_DATABASE_URL: postgres://sms:sms@localhost:5432/sms
      APP_DATABASE_URL: postgres://sms_app:sms_app@localhost:5432/sms
      SMS_APP_PASSWORD: sms_app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        working-directory: ${{ github.workspace }}
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Migrate up / down / up
        run: |
          pnpm migrate:up
          pnpm migrate:down
          pnpm migrate:down
          pnpm migrate:down
          pnpm migrate:up
      - run: pnpm test
      - name: Build Docker image
        working-directory: ${{ github.workspace }}
        run: docker build -f backend/Dockerfile -t sms-gateway-backend:ci .
      - name: Validate Compose files
        working-directory: ${{ github.workspace }}
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.authentik.yml --profile authentik config -q
