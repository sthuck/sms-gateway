name: Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip until web app exists
        run: |
          if [ -f web/package.json ]; then
            echo "web/package.json present — replace this job with real lint/test"
            exit 1
          fi
          echo "No web package yet; placeholder OK"
