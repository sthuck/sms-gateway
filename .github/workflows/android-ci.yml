name: Android CI

on:
  # PR branches only via pull_request (avoids push+PR double runs).
  # Pushes to main still get a post-merge build.
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew scripts/check-room-schema.sh

      # GitHub-hosted runners already ship ANDROID_HOME. Do not use
      # android-actions/setup-android: it still tries to install the obsolete
      # `tools` package and fails with "Failed to find package 'tools'".
      - name: Ensure Android SDK platform 37.2
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "ANDROID_HOME / ANDROID_SDK_ROOT is not set" >&2
            exit 1
          fi
          echo "Using Android SDK at $SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK" -path '*cmdline-tools*' -name sdkmanager -type f | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;36.0.0"

      - name: Check Room schema JSON matches version (and migrations on bump)
        run: ./scripts/check-room-schema.sh

      - name: Build, lint, and unit test (devDebug)
        run: ./gradlew assembleDevDebug lintDevDebug testDevDebugUnitTest --stacktrace --refresh-dependencies

      # Catches entity changes that rebuild schema JSON without a version bump,
      # and commented-out / skipped migrations that fooled the static script.
      - name: Fail if Room schema export drifted from git
        run: |
          git diff --exit-code -- app/schemas || {
            echo "Room schema JSON under app/schemas changed during the build." >&2
            echo "Bump APP_DATABASE_VERSION, commit the new schema, and add a Migration." >&2
            exit 1
          }

      - name: Assemble prod release
        run: ./gradlew assembleProdRelease --stacktrace

      - name: Upload dev debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-dev-debug
          path: android/app/build/outputs/apk/dev/debug/*.apk

      - name: Upload prod release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-prod-release
          path: android/app/build/outputs/apk/prod/release/*.apk

  instrumented:
    name: instrumented
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -eux
          df -h
          # Previous run: emulator FATAL "Not enough space to create userdata
          # partition. Available: 6244 MB, need 7372 MB". Drop heavy unused
          # toolchains so the AVD userdata image fits.
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk* || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images/android-28 || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images/android-29 || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images/android-30 || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images/android-31 || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images/android-32 || true
          sudo rm -rf /usr/local/lib/android/sdk/system-images/android-33 || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo docker system prune -af || true
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew scripts/run-connected-dev-debug.sh

      - name: Ensure Android SDK platform 37.2
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "ANDROID_HOME / ANDROID_SDK_ROOT is not set" >&2
            exit 1
          fi
          echo "Using Android SDK at $SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK" -path '*cmdline-tools*' -name sdkmanager -type f | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;36.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          id -nG

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api34-google-apis-x86_64-disk4g-v2

      - name: Generate AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # Default userdata (~7.3 GiB) exceeded free space on ubuntu-latest.
          disk-size: 4096M
          heap-size: 512M
          ram-size: 2048M
          cores: 2
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: false
          working-directory: android
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disk-size: 4096M
          heap-size: 512M
          ram-size: 2048M
          cores: 2
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          disable-animations: true
          working-directory: android
          script: ./scripts/run-connected-dev-debug.sh

      - name: Upload instrumented test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            android/app/build/reports/androidTests/**
            android/app/build/reports/logcat-connected.txt
            android/app/build/outputs/androidTest-results/**
          if-no-files-found: warn
